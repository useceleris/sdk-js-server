name: Tests
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer run for the same branch or pull request cancels the older one.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  # Unit, validation, provider and packaged-consumer suites. No service stack.
  check:
    strategy:
      fail-fast: false
      matrix:
        # Linux on Blacksmith; Windows stays GitHub-hosted.
        os: [blacksmith-4vcpu-ubuntu-2404, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: denoland/setup-deno@v2
        with:
          deno-version: latest
      # @useceleris/client resolves from the registry like any other
      # dependency; it publishes ahead of this package.
      - run: npm install
      # Build, both typechecks, formatting and the suites.
      - run: npm run check
