name: Server foundation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { kind: node, version: "22.15.0" }
          - { kind: node, version: "22" }
          - { kind: node, version: "24" }
          - { kind: node, version: "26" }
          - { kind: bun, version: "1.3.0" }
          - { kind: bun, version: "latest" }
          - { kind: deno, version: "2.5.0" }
          - { kind: deno, version: "latest" }
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: npm
      - if: matrix.kind == 'node'
        run: npm install --prefix "$RUNNER_TEMP/celeris-runtime" --no-save --package-lock=false "node@${{ matrix.version }}"
      - if: matrix.kind == 'bun'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ matrix.version }}
      - if: matrix.kind == 'deno'
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: ${{ matrix.version }}
      - run: npm install
      - run: git diff --exit-code -- package.json package-lock.json
      - name: Select consumer runtime
        env:
          RUNTIME_KIND: ${{ matrix.kind }}
          RUNTIME_VERSION: ${{ matrix.version }}
        run: |
          node --input-type=module -e '
            import { appendFileSync } from "node:fs";
            const kind = process.env.RUNTIME_KIND;
            const command = kind === "node" ? `${process.env.RUNNER_TEMP}/celeris-runtime/node_modules/node/bin/node` : kind;
            const matrix = [{ name: `${kind}-${process.env.RUNTIME_VERSION}`, kind, command }];
            appendFileSync(process.env.GITHUB_ENV, `CELERIS_RUNTIME_MATRIX=${JSON.stringify(matrix)}\n`);
          '
      - run: npm run check
      - run: npm audit --audit-level=high
      - run: git diff --exit-code -- package.json package-lock.json
  os-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      CELERIS_RUNTIME_MATRIX: '[{"name":"node-current","kind":"node","command":"node"}]'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "26"
          cache: npm
      - run: npm install
      - run: git diff --exit-code -- package.json package-lock.json
      - run: npm run check
      - run: git diff --exit-code -- package.json package-lock.json
